services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/static/
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
  db:
    image: postgres:16.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  celery_worker:
    build: .
    command: celery -A config worker -l info -P solo
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  celery_beat:
    build: .
    command: celery -A config beat --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - ./.env


volumes:
  postgres_data:
  redis_data:
  static_volume:


